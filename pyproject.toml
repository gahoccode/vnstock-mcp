[project]
name = "vnstock-mcp"
version = "0.3.0"
description = "Vietnamese Stock Market MCP Server - FastMCP 2.0"
readme = "README.md"
license = "MIT"

keywords = ["vietnam", "stock", "market", "mcp", "fastmcp", "financial", "vnstock"]
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.0.0",
    "vnstock>=4.0.2,<5",
    "pandas",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    "pytz>=2025.2",
]


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
vnstock-mcp = "vnstock_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vnstock_mcp*"]


[project.urls]
Repository = "https://github.com/gahoccode/vnstock-mcp"



[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "vulture>=2.14",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
